[platformio]
src_dir = .

[env:pro_micro]
platform = atmelavr
board = leonardo
framework = arduino
board_build.mcu = atmega32u4
board_build.f_cpu = 16000000L
build_src_filter = +<pro-micro/> 
build_flags = -Ishared
upload_protocol = avr109
monitor_speed = 115200
lib_deps =
    https://github.com/MHeironimus/ArduinoJoystickLibrary.git

[env:mh_tiny]
platform = atmelavr
board = attiny88
board_build.f_cpu = 16000000L
framework = arduino
build_src_filter = +<mh-tiny/>
upload_protocol = micronucleus
build_unflags = -Os -flto
build_flags = 
    -D PINMAPPING_MHTINY 
    -D CLOCK_SOURCE=18 
    -O0
    -Ishared
